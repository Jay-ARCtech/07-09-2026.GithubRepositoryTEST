<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Strict CSP. The game ships zero third-party code and makes zero network
      requests at runtime, so everything can be locked to 'self'.
      'unsafe-inline' is deliberately absent from script-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="PARRY CORE - a one-thumb radial parry arcade roguelite. No forced ads, no pay-to-win, plays offline." />
    <title>PARRY CORE</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="PARRY CORE game board" role="img"></canvas>
    <div id="boot">
      <div id="boot-mark"></div>
      <p id="boot-text">PARRY CORE</p>
    </div>
    <noscript>
      <p class="noscript">PARRY CORE needs JavaScript enabled to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
