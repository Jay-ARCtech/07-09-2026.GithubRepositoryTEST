<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PARRY CORE app mark: a hex core inside a shield arc with a white sweet spot. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4de2ff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#4de2ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4de2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- faint orbit -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#4de2ff" stroke-opacity="0.16" stroke-width="4"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="#4de2ff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- core glow + hexagon -->
  <circle cx="256" cy="256" r="96" fill="url(#coreGlow)"/>
  <polygon points="256,178 323,217 323,295 256,334 189,295 189,217"
           fill="#4de2ff" fill-opacity="0.22" stroke="#4de2ff" stroke-width="9"/>

  <!-- shield arc, opening upward, with the white sweet spot at its centre -->
  <path d="M 129 190 A 142 142 0 0 1 383 190" fill="none"
        stroke="#4de2ff" stroke-width="30" stroke-linecap="round"/>
  <path d="M 212 133 A 142 142 0 0 1 300 133" fill="none"
        stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
</svg>
